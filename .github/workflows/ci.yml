name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Keyed on rustc version + Cargo.lock + OS/arch, and it prunes this crate's OWN artifacts
      # before saving, so chordia_contracts is always recompiled from the checked-out source.
      # That is what keeps the drift gate below honest: ./bindings is a tracked git directory, so
      # nothing here can substitute a stale generated file for a freshly generated one.
      # Deliberately NOT `cache-on-failure`: `cargo fmt --all --check` runs first and compiles
      # nothing, so a formatting failure would save an empty entry -- and on a full key match
      # rust-cache skips the save, so nothing could ever replace it.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

      # Both optional feature flags must compile: `ts` (ts-rs bindings) and `openapi`
      # (utoipa::ToSchema derives the backend relies on to emit its OpenAPI spec).
      - run: cargo build --features openapi

      # index.ts must surface every binding (re-export or hand-written override) and carry no stale
      # re-exports. Cheap static check, run against the committed tree BEFORE regenerating.
      - name: index.ts <-> bindings consistency
        run: node scripts/check-bindings.mjs

      - name: Generate TypeScript bindings
        run: cargo test --features ts

      # The two recurring footguns this boundary has: a wire type changed but the committed bindings
      # were not regenerated, and a binding was added or removed but index.ts was not updated. CI
      # generated the bindings but never compared them, so drift passed silently.
      - name: Fail if bindings drifted from the Rust source
        run: |
          if ! git diff --quiet -- bindings; then
            echo "::error::Committed ./bindings are stale. Run 'npm run generate' and commit the result."
            git diff -- bindings
            exit 1
          fi

  publish:
    needs: [rust]
    if: startsWith(github.ref, 'refs/tags/v')
    # 2vCPU on purpose: this job is one script/download, never four cores' worth of work.
    # Compile jobs stay at 4 — halving cores on parallel work doubles the time for the same
    # bill, so it would buy latency and nothing else.
    # ...and ARM, which is cheaper again. Safe HERE and nowhere else: this job ships no
    # artifact, so the architecture it ran on cannot reach production or a user's machine.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v7
      # NOT every `v*` tag in this repository is a release of this crate.
      #
      # The desktop app's releases are MIRRORED here, because `frontend` is private and GitHub will
      # not serve its release assets to an unauthenticated updater (see `release.yml` there). That
      # mirror creates a release, a release needs a tag, and the tag it uses is the APP's version --
      # `v0.2.0`, `v0.2.1`. Those match the trigger above and ran this job, which then failed on
      # `cargo publish --token` with an empty token, once per desktop release.
      #
      # So the tag has to prove it belongs to the crate before anything is published. Comparing it
      # against `Cargo.toml` needs no secret, no variable to remember to set, and stays correct
      # after the mirror moves out of this repository -- at which point this guard simply never
      # fires again rather than needing to be found and removed.
      - name: Does this tag name this crate's version?
        id: owns
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "crate=$crate tag=$tag"
          if [ "$crate" = "$tag" ]; then
            echo "ours=true" >> "$GITHUB_OUTPUT"
          else
            echo "ours=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $GITHUB_REF_NAME is not this crate's version ($crate), so nothing is published. This is a mirrored desktop release."
          fi
      - if: steps.owns.outputs.ours == 'true'
        uses: dtolnay/rust-toolchain@stable
      # Publish the Rust crate.
      - if: steps.owns.outputs.ours == 'true'
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Generate + publish the npm package.
      - if: steps.owns.outputs.ours == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - if: steps.owns.outputs.ours == 'true'
        run: cargo test --features ts
      - if: steps.owns.outputs.ours == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
